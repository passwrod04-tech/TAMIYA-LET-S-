<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamiya JCJC Track Simulation - Fixed</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #111; color: white; }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(0,0,0,0.85); padding: 15px 20px; border-radius: 8px; border: 1px solid #444; }
        h2 { margin: 0 0 5px 0; font-size: 1.1rem; color: #ff4444; }
        p { margin: 0 0 10px 0; font-size: 0.8rem; color: #ccc; }
        button { background: #e53935; color: white; border: none; padding: 10px 18px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        button:hover { background: #ff5252; }
    </style>
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui">
        <h2>Tamiya JCJC Track 3D</h2>
        <p>สนามมาตรฐาน 3 เลน + สะพานยกระดับสลับเลน</p>
        <button onclick="toggleRace()" id="race-btn">ปล่อยรถแข่ง / หยุด</button>
    </div>

    <div id="canvas-container"></div>

<script>
// --- 1. Setup Scene ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 18, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const light = new THREE.DirectionalLight(0xffffff, 0.9);
light.position.set(10, 20, 10);
scene.add(light);

scene.add(new THREE.GridHelper(30, 30, 0x444444, 0x222222));

// --- 2. Track Points (พิกัดสนาม JCJC) ---
const trackPoints = [
    new THREE.Vector3( 4, 0,   6),
    new THREE.Vector3( 7, 0,   0),
    new THREE.Vector3( 4, 0,  -6),
    new THREE.Vector3( 1, 0,  -6),
    new THREE.Vector3(-1, 0,  -6),
    new THREE.Vector3(-4, 0,  -6),
    new THREE.Vector3(-7, 0,   0),
    new THREE.Vector3(-4, 0,   6),
    new THREE.Vector3(-2.5, 0,   6),
    new THREE.Vector3(-1.0, 1.2, 5.7),
    new THREE.Vector3( 0.0, 1.2, 6.0),
    new THREE.Vector3( 1.0, 1.2, 6.3),
    new THREE.Vector3( 2.5, 0,   6)
];

const trackCurve = new THREE.CatmullRomCurve3(trackPoints, true, 'centripetal');

// --- 3. สร้างโมเดลราง 3D ---
const tubeGeo = new THREE.TubeGeometry(trackCurve, 300, 0.7, 8, false);
const trackMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.4 });
const trackMesh = new THREE.Mesh(tubeGeo, trackMat);
trackMesh.scale.set(1, 0.15, 1);
scene.add(trackMesh);

// --- 4. สร้างโมเดลรถ Tamiya ---
const carGroup = new THREE.Group();

// บอดี้รถ
const bodyGeo = new THREE.BoxGeometry(0.7, 0.25, 1.2);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1565c0, roughness: 0.2, metalness: 0.3 });
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.position.y = 0.2;
carGroup.add(body);

// ล้อรถ 4 ล้อ
const wheelGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.08, 16);
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

const wheelPositions = [
    [-0.4, 0.18,  0.35],
    [ 0.4, 0.18,  0.35],
    [-0.4, 0.18, -0.35],
    [ 0.4, 0.18, -0.35]
];

wheelPositions.forEach(pos => {
    const wheel = new THREE.Mesh(wheelGeo, wheelMat);
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(...pos);
    carGroup.add(wheel);
});

scene.add(carGroup);

// --- 5. ระบบขับเคลื่อนที่ถูกต้องสมบูรณ์ ---
let progress = 0;
let isRacing = false;
const speed = 0.0025;

function toggleRace() {
    isRacing = !isRacing;
}

const currentPos = new THREE.Vector3();
const targetPos = new THREE.Vector3();
const upVector = new THREE.Vector3(0, 1, 0);

function animate() {
    requestAnimationFrame(animate);

    if (isRacing) {
        progress += speed;
        if (progress >= 1) progress = 0;

        // 1. หาตำแหน่งปัจจุบันบนเส้นทาง
        trackCurve.getPointAt(progress, currentPos);
        
        // 2. หาตำแหน่งที่จะมุ่งหน้าไปข้างหน้า (ห่างไป 0.5% ของเส้นทาง)
        const targetProgress = (progress + 0.005) % 1;
        trackCurve.getPointAt(targetProgress, targetPos);

        // 3. ยกระดับรถให้อยู่บนรางพอดี
        currentPos.y += 0.12;
        targetPos.y += 0.12;

        carGroup.position.copy(currentPos);

        // 4. บังคับหน้ารถหันไปหา targetPos โดยล็อกแกน Up ไม่ให้รถควง/พลิก
        carGroup.up.copy(upVector);
        carGroup.lookAt(targetPos);
    }

    controls.update();
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
