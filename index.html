<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamiya Mini 4WD Builder & Racer - Custom Track</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #111; color: white; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        /* UI Overlay */
        .ui-panel { position: absolute; z-index: 10; background: rgba(0,0,0,0.85); border: 1px solid #444; border-radius: 8px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #parts-selector { top: 20px; left: 20px; width: 300px; max-height: 80vh; overflow-y: auto; }
        #stats-panel { top: 20px; right: 20px; width: 220px; }
        #race-ui { bottom: 20px; left: 50%; transform: translateX(-50%); text-align: center; display: none; }
        
        h3 { margin: 0 0 10px 0; color: #ff4444; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .step-title { font-size: 0.9rem; color: #ffca28; margin-bottom: 8px; font-weight: bold; }
        .item-btn { display: block; width: 100%; padding: 10px; margin: 5px 0; background: #222; border: 1px solid #555; color: white; border-radius: 5px; cursor: pointer; text-align: left; transition: 0.2s; }
        .item-btn:hover { background: #e53935; border-color: #ff5252; }
        
        .stat-bar { margin: 6px 0; font-size: 0.85rem; display: flex; justify-content: space-between; }
        .stat-val { font-weight: bold; color: #00e676; }
        .btn-action { background: #e53935; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 1rem; margin: 0 5px; }
        .btn-action:hover { background: #ff5252; }
    </style>
    
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- UI โรงงานแต่งรถ (Garage UI) -->
    <div id="parts-selector" class="ui-panel">
        <h3>Garage Builder</h3>
        <div id="step-desc" class="step-title">ขั้นตอนที่ 1: เลือก Chassis</div>
        <div id="options-list"></div>
    </div>

    <!-- UI แสดงค่าสเตตัสรถ -->
    <div id="stats-panel" class="ui-panel">
        <h3>Car Stats</h3>
        <div class="stat-bar">Speed: <span id="st-speed" class="stat-val">0</span></div>
        <div class="stat-bar">Accel: <span id="st-accel" class="stat-val">0</span></div>
        <div class="stat-bar">Weight: <span id="st-weight" class="stat-val">0 g</span></div>
        <div class="stat-bar">Stability: <span id="st-stab" class="stat-val">0</span></div>
        <br>
        <button id="go-race-btn" class="btn-action" style="width: 100%; display: none;" onclick="startRaceMode()">เข้าสู่สนามแข่ง!</button>
    </div>

    <!-- UI โหมดแข่งขัน -->
    <div id="race-ui" class="ui-panel">
        <h2 style="margin: 0 0 5px 0; color: #00e676; font-family: monospace; font-size: 2rem;" id="timer">00:00:00</h2>
        <div id="lap-counter" style="margin-bottom: 10px; font-weight: bold;">Lap: 0 / 3</div>
        <button class="btn-action" onclick="toggleRun()" id="btn-run">ปล่อยรถ</button>
        <button class="btn-action" style="background: #555;" onclick="resetGame()">แต่งรถใหม่</button>
    </div>

    <div id="canvas-container"></div>

<script>
// --- 1. SETUP SCENE & CAMERA ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 4, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// แสงสว่าง
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const light = new THREE.DirectionalLight(0xffffff, 1.0);
light.position.set(5, 12, 8);
scene.add(light);

// Grid พื้นหลัง
const grid = new THREE.GridHelper(30, 30, 0x444444, 0x222222);
scene.add(grid);

// --- 2. DATA PARTS & STATS ---
const assemblySteps = [
    { key: 'chassis', name: 'Chassis', items: [
        { name: 'AR Chassis', speed: 5, accel: 6, weight: 15, stab: 7, color: 0x222222 },
        { name: 'MA Chassis', speed: 6, accel: 7, weight: 18, stab: 8, color: 0x1565c0 },
        { name: 'FM-A Chassis', speed: 6, accel: 8, weight: 16, stab: 6, color: 0xc62828 }
    ]},
    { key: 'motor', name: 'Motor', items: [
        { name: 'Atomic-Tuned', speed: 12, accel: 10, weight: 10, stab: 0, color: 0xef6c00 },
        { name: 'Hyper-Dash', speed: 22, accel: 18, weight: 11, stab: -2, color: 0xd84315 },
        { name: 'Mach-Dash', speed: 28, accel: 15, weight: 10, stab: -5, color: 0x1565c0 }
    ]},
    { key: 'wheels', name: 'Wheels & Tires', items: [
        { name: 'Small Diameter (High Accel)', speed: 2, accel: 10, weight: 8, stab: 5, color: 0x333333 },
        { name: 'Large Diameter (High Speed)', speed: 10, accel: 2, weight: 12, stab: 2, color: 0xffb300 }
    ]},
    { key: 'body', name: 'Body Shell', items: [
        { name: 'Avante Mk.III', speed: 4, accel: 2, weight: 12, stab: 2, color: 0x1976d2 },
        { name: 'Magnum Saber', speed: 3, accel: 1, weight: 14, stab: 4, color: 0xffffff },
        { name: 'Neo-Vanquish', speed: 5, accel: 3, weight: 10, stab: 1, color: 0x388e3c }
    ]}
];

let currentStep = 0;
let carStats = { speed: 0, accel: 0, weight: 0, stab: 0 };

// 3D Object Group ของตัวรถ
const carGroup = new THREE.Group();
scene.add(carGroup);

// --- 3. GARAGE BUILDER LOGIC ---
function renderUI() {
    const listEl = document.getElementById('options-list');
    listEl.innerHTML = '';
    
    if (currentStep < assemblySteps.length) {
        const step = assemblySteps[currentStep];
        document.getElementById('step-desc').innerText = `ขั้นตอนที่ ${currentStep + 1}: เลือก ${step.name}`;
        
        step.items.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'item-btn';
            btn.innerHTML = `<strong>${item.name}</strong><br><small>Speed: +${item.speed} | Weight: ${item.weight}g</small>`;
            btn.onclick = () => selectPart(step.key, item);
            listEl.appendChild(btn);
        });
    } else {
        document.getElementById('step-desc').innerText = "ประกอบรถเสร็จสมบูรณ์!";
        document.getElementById('go-race-btn').style.display = 'block';
    }
}

function selectPart(stepKey, item) {
    carStats.speed += item.speed;
    carStats.accel += item.accel;
    carStats.weight += item.weight;
    carStats.stab += item.stab;
    
    document.getElementById('st-speed').innerText = carStats.speed;
    document.getElementById('st-accel').innerText = carStats.accel;
    document.getElementById('st-weight').innerText = carStats.weight + " g";
    document.getElementById('st-stab').innerText = carStats.stab;

    updateCarModel(stepKey, item);

    currentStep++;
    renderUI();
}

function updateCarModel(key, item) {
    if (key === 'chassis') {
        const geo = new THREE.BoxGeometry(0.8, 0.2, 1.8);
        const mat = new THREE.MeshStandardMaterial({ color: item.color, roughness: 0.5 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.y = 0.15;
        carGroup.add(mesh);
    } 
    else if (key === 'motor') {
        const mGeo = new THREE.BoxGeometry(0.4, 0.25, 0.5);
        const mMat = new THREE.MeshStandardMaterial({ color: item.color, metalness: 0.5 });
        const mMesh = new THREE.Mesh(mGeo, mMat);
        mMesh.position.set(0, 0.25, -0.2);
        carGroup.add(mMesh);
    }
    else if (key === 'wheels') {
        const wGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.12, 16);
        const wMat = new THREE.MeshStandardMaterial({ color: item.color });
        const wheelPos = [
            [-0.45, 0.25,  0.5],
            [ 0.45, 0.25,  0.5],
            [-0.45, 0.25, -0.5],
            [ 0.45, 0.25, -0.5]
        ];
        wheelPos.forEach(p => {
            const w = new THREE.Mesh(wGeo, wMat);
            w.rotation.z = Math.PI / 2;
            w.position.set(...p);
            carGroup.add(w);
        });
    } 
    else if (key === 'body') {
        const bGeo = new THREE.BoxGeometry(0.7, 0.25, 1.2);
        const bMat = new THREE.MeshStandardMaterial({ color: item.color, roughness: 0.2, metalness: 0.2 });
        const bMesh = new THREE.Mesh(bGeo, bMat);
        bMesh.position.y = 0.35;
        carGroup.add(bMesh);
    }
}

// --- 4. TRACK & RACE SYSTEM (ภาพสนามจากต้นฉบับ) ---
let isRacingMode = false;
let isRunning = false;
let progress = 0;
let lap = 0;
let startTime = 0;
let elapsedTime = 0;
let raceTimer = null;

// พิกัดสนามแข่งขนาดใหญ่ตามรูปภาพ
const trackPoints = [
    // ทางตรงด้านหน้า
    new THREE.Vector3(-10, 0,  8),
    new THREE.Vector3(  0, 0,  8),
    new THREE.Vector3( 10, 0,  8),
    // โค้งขวาใหญ่ขึ้นบน
    new THREE.Vector3( 13, 0,  4),
    new THREE.Vector3( 11, 0, -2),
    // สลาลม S-Curve ตรงกลาง
    new THREE.Vector3(  5, 0,  0),
    new THREE.Vector3(  0, 0, -3),
    new THREE.Vector3( -5, 0,  0),
    // โค้งอ้อมไปด้านหลัง
    new THREE.Vector3(-11, 0, -4),
    new THREE.Vector3(-10, 0, -9),
    new THREE.Vector3(  0, 0, -9),
    // สะพานยกระดับสลับเลนด้านขวาบน
    new THREE.Vector3(  6, 0.0, -9),
    new THREE.Vector3(  8, 1.5, -8.5), // จุดสูงสุดของสะพาน
    new THREE.Vector3( 10, 0.0, -8),
    // โค้งลูปกลับเข้าจุดเริ่มต้น
    new THREE.Vector3( 12, 0, -4),
    new THREE.Vector3(  8, 0,  3),
    new THREE.Vector3(-12, 0,  4)
];
const trackCurve = new THREE.CatmullRomCurve3(trackPoints, true, 'centripetal');

// โมเดลราง 3D
const tubeGeo = new THREE.TubeGeometry(trackCurve, 400, 0.7, 8, false);
const trackMesh = new THREE.Mesh(tubeGeo, new THREE.MeshStandardMaterial({ color: 0xe0e0e0, roughness: 0.3 }));
trackMesh.scale.set(1, 0.15, 1);
trackMesh.visible = false;
scene.add(trackMesh);

function startRaceMode() {
    isRacingMode = true;
    document.getElementById('parts-selector').style.display = 'none';
    document.getElementById('stats-panel').style.display = 'none';
    document.getElementById('race-ui').style.display = 'block';
    
    grid.visible = false;
    trackMesh.visible = true;
    
    // ตั้งค่ามุมกล้องแบบวิวมุมสูงเพื่อให้เห็นทั่วทั้งสนามขนาดใหญ่
    camera.position.set(0, 25, 25);
    controls.target.set(0, 0, 0);
}

function resetGame() {
    location.reload();
}

function toggleRun() {
    const btn = document.getElementById('btn-run');
    isRunning = !isRunning;
    
    if (isRunning) {
        btn.innerText = "หยุดรถ";
        btn.style.background = "#ff9800";
        if(lap >= 3) { lap = 0; progress = 0; elapsedTime = 0; }
        startTime = Date.now() - elapsedTime;
        raceTimer = setInterval(updateTimer, 10);
    } else {
        btn.innerText = "ปล่อยรถ";
        btn.style.background = "#e53935";
        elapsedTime = Date.now() - startTime;
        clearInterval(raceTimer);
    }
}

function updateTimer() {
    const diff = Date.now() - startTime;
    const ms = Math.floor((diff % 1000) / 10).toString().padStart(2, '0');
    const sec = Math.floor((diff / 1000) % 60).toString().padStart(2, '0');
    const min = Math.floor(diff / (1000 * 60)).toString().padStart(2, '0');
    document.getElementById('timer').innerText = `${min}:${sec}:${ms}`;
}

// --- 5. ANIMATION LOOP ---
const currentPos = new THREE.Vector3();
const targetPos = new THREE.Vector3();
const upVector = new THREE.Vector3(0, 1, 0);

function animate() {
    requestAnimationFrame(animate);

    if (isRacingMode && isRunning) {
        // ปรับสเกลความเร็วให้สมดุลกับความยาวของสนามใหม่
        const runSpeed = 0.0006 + (carStats.speed * 0.00008);
        progress += runSpeed;

        if (progress >= 1) {
            progress -= 1;
            lap++;
            document.getElementById('lap-counter').innerText = `Lap: ${Math.min(lap, 3)} / 3`;
            
            if (lap >= 3) {
                isRunning = false;
                clearInterval(raceTimer);
                document.getElementById('btn-run').innerText = "ปล่อยรถอีกครั้ง";
                document.getElementById('btn-run').style.background = "#e53935";
                setTimeout(() => alert(`เข้าเส้นชัยแล้ว! เวลาสถิติสนามนี้: ${document.getElementById('timer').innerText}`), 100);
            }
        }

        trackCurve.getPointAt(progress, currentPos);
        trackCurve.getPointAt((progress + 0.003) % 1, targetPos);

        currentPos.y += 0.12;
        targetPos.y += 0.12;

        carGroup.position.copy(currentPos);
        carGroup.up.copy(upVector);
        carGroup.lookAt(targetPos);
    }

    controls.update();
    renderer.render(scene, camera);
}

renderUI();
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
