<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamiya JCJC Track Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #111; color: white; }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(0,0,0,0.8); padding: 15px 20px; border-radius: 8px; border: 1px solid #444; }
        h2 { margin: 0 0 5px 0; font-size: 1.1rem; color: #ff4444; }
        p { margin: 0 0 10px 0; font-size: 0.8rem; color: #ccc; }
        button { background: #e53935; color: white; border: none; padding: 10px 18px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        button:hover { background: #ff5252; }
    </style>
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui">
        <h2>Tamiya JCJC Track 3D</h2>
        <p>ระบบจำลองสนามและรถแข่งแบบเสถียร</p>
        <button onclick="toggleRace()">ปล่อยรถแข่ง / หยุด</button>
    </div>

    <div id="canvas-container"></div>

<script>
// --- 1. Scene & Camera Setup ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 18, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const light = new THREE.DirectionalLight(0xffffff, 0.8);
light.position.set(10, 20, 10);
scene.add(light);

scene.add(new THREE.GridHelper(30, 30, 0x444444, 0x222222));

// --- 2. Track Path (พิกัดสนาม JCJC) ---
const trackPoints = [
    new THREE.Vector3( 4, 0,  6),
    new THREE.Vector3( 7, 0,  0),
    new THREE.Vector3( 4, 0, -6),
    new THREE.Vector3( 1, 0, -6),
    new THREE.Vector3(-1, 0, -6),
    new THREE.Vector3(-4, 0, -6),
    new THREE.Vector3(-7, 0,  0),
    new THREE.Vector3(-4, 0,  6),
    new THREE.Vector3(-2.5, 0,   6),
    new THREE.Vector3(-1.0, 1.2, 5.7),
    new THREE.Vector3( 0.0, 1.2, 6.0),
    new THREE.Vector3( 1.0, 1.2, 6.3),
    new THREE.Vector3( 2.5, 0,   6)
];

const trackCurve = new THREE.CatmullRomCurve3(trackPoints, true, 'centripetal');

// --- 3. Track Visualization (สร้างตัวรางด้วยวิธีที่เรียบง่ายที่สุด) ---
const points = trackCurve.getPoints(200);
const trackGroup = new THREE.Group();

// สร้างพื้นรางตรงกลาง
const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
const lineMat = new THREE.LineBasicMaterial({ color: 0xff4444, linewidth: 2 });
const centerLine = new THREE.Line(lineGeo, lineMat);
trackGroup.add(centerLine);

// สร้างฐานรองรางทรงกระบอกเรียบๆ ตามจุดวิ่ง
const tubeGeo = new THREE.TubeGeometry(trackCurve, 150, 0.6, 8, false);
const tubeMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, wireframe: false, roughness: 0.6 });
const trackMesh = new THREE.Mesh(tubeGeo, tubeMat);
trackMesh.scale.set(1, 0.2, 1); // บีบความสูงให้แบนเป็นแผ่น
trackGroup.add(trackMesh);

scene.add(trackGroup);

// --- 4. Car Construction ---
const carGroup = new THREE.Group();

// ตัวบอดี้รถ
const bodyGeo = new THREE.BoxGeometry(0.7, 0.25, 1.2);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1565c0, roughness: 0.2 });
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.position.y = 0.2;
carGroup.add(body);

// ล้อรถ 4 ล้อ
const wheelGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.08, 16);
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

const wheelPositions = [
    [-0.4, 0.18,  0.35],
    [ 0.4, 0.18,  0.35],
    [-0.4, 0.18, -0.35],
    [ 0.4, 0.18, -0.35]
];

wheelPositions.forEach(pos => {
    const wheel = new THREE.Mesh(wheelGeo, wheelMat);
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(...pos);
    carGroup.add(wheel);
});

scene.add(carGroup);

// --- 5. Movement Logic ---
let progress = 0;
let isRacing = false;
const speed = 0.0025;

function toggleRace() {
    isRacing = !isRacing;
}

function animate() {
    requestAnimationFrame(animate);

    if (isRacing) {
        progress += speed;
        if (progress >= 1) progress = 0;

        // ดึงจุดปัจจุบันและจุดถัดไป
        const p1 = trackCurve.getPointAt(progress);
        const p2 = trackCurve.getPointAt((progress + 0.004) % 1);

        // วางตำแหน่งรถ
        carGroup.position.set(p1.x, p1.y + 0.12, p1.z);

        // บังคับทิศทางหน้ารถให้มุ่งหน้าไปจุด p2 (กลับทิศทาง p1-p2 เพื่อแก้ปัญหารถถอยหลัง)
        const target = new THREE.Vector3().subVectors(p1, p2).add(p1);
        target.y = p1.y + 0.12;
        carGroup.lookAt(target);
    }

    controls.update();
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
