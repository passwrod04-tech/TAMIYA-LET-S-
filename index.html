<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamiya Mini 4WD Builder & Racer</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #111; color: white; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        /* UI Overlay */
        .ui-panel { position: absolute; z-index: 10; background: rgba(0,0,0,0.85); border: 1px solid #444; border-radius: 8px; padding: 15px; }
        #parts-selector { top: 20px; left: 20px; width: 280px; max-height: 80vh; overflow-y: auto; }
        #stats-panel { top: 20px; right: 20px; width: 220px; }
        #race-ui { bottom: 20px; left: 50%; transform: translateX(-50%); text-align: center; display: none; }
        
        h3 { margin: 0 0 10px 0; color: #ff4444; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .step-title { font-size: 0.9rem; color: #ffca28; margin-bottom: 8px; }
        .item-btn { display: block; width: 100%; padding: 8px; margin: 4px 0; background: #222; border: 1px solid #555; color: white; border-radius: 4px; cursor: pointer; text-align: left; }
        .item-btn:hover { background: #ff4444; }
        
        .stat-bar { margin: 5px 0; font-size: 0.8rem; }
        .btn-action { background: #e53935; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 1rem; }
        .btn-action:hover { background: #ff5252; }
    </style>
    
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- UI โรงงานแต่งรถ (Garage UI) -->
    <div id="parts-selector" class="ui-panel">
        <h3>Garage Builder</h3>
        <div id="step-desc" class="step-title">ขั้นตอนที่ 1:เลือก Chassis</div>
        <div id="options-list"></div>
    </div>

    <!-- UI แสดงค่าสเตตัสรถ -->
    <div id="stats-panel" class="ui-panel">
        <h3>Car Stats</h3>
        <div class="stat-bar">Speed: <span id="st-speed">0</span></div>
        <div class="stat-bar">Accel: <span id="st-accel">0</span></div>
        <div class="stat-bar">Weight: <span id="st-weight">0</span> g</div>
        <div class="stat-bar">Stability: <span id="st-stab">0</span></div>
        <br>
        <button id="go-race-btn" class="btn-action" style="width: 100%; display: none;" onclick="startRaceMode()">ไปสนามแข่ง!</button>
    </div>

    <!-- UI โหมดแข่งขัน -->
    <div id="race-ui" class="ui-panel">
        <h2 style="margin: 0 0 5px 0; color: #00e676;" id="timer">00:00:00</h2>
        <div id="lap-counter" style="margin-bottom: 10px;">Lap: 0 / 3</div>
        <button class="btn-action" onclick="toggleRun()">ปล่อยรถ / หยุด</button>
        <button class="btn-action" style="background: #555;" onclick="backToGarage()">กลับอู่แต่งรถ</button>
    </div>

    <div id="canvas-container"></div>

<script>
// --- 1. SETUP SCENE & CAMERA ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 5, 10);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// แสงสว่าง
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const light = new THREE.DirectionalLight(0xffffff, 0.9);
light.position.set(5, 10, 7);
scene.add(light);

// Grid พื้นหลัง
const grid = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
scene.add(grid);

// --- 2. DATA PARTS & STATS ---
const assemblySteps = [
    { key: 'chassis', name: 'Chassis', items: [
        { name: 'AR Chassis', speed: 5, accel: 6, weight: 15, stab: 7, color: 0x222222 },
        { name: 'MA Chassis', speed: 6, accel: 7, weight: 18, stab: 8, color: 0x1565c0 },
        { name: 'FM-A Chassis', speed: 6, accel: 8, weight: 16, stab: 6, color: 0xc62828 }
    ]},
    { key: 'motor', name: 'Motor', items: [
        { name: 'Atomic-Tuned', speed: 12, accel: 10, weight: 10, stab: 0, color: 0xef6c00 },
        { name: 'Hyper-Dash', speed: 22, accel: 18, weight: 11, stab: -2, color: 0xd84315 },
        { name: 'Mach-Dash', speed: 28, accel: 15, weight: 10, stab: -5, color: 0x1565c0 }
    ]},
    { key: 'wheels', name: 'Wheels & Tires', items: [
        { name: 'Small Diameter (High Accel)', speed: 0, accel: 10, weight: 8, stab: 5, color: 0x333333 },
        { name: 'Large Diameter (High Speed)', speed: 10, accel: -2, weight: 12, stab: 2, color: 0xffb300 }
    ]},
    { key: 'body', name: 'Body Shell', items: [
        { name: 'Avante Mk.III', speed: 2, accel: 2, weight: 12, stab: 2, color: 0x1976d2 },
        { name: 'Magnum Saber', speed: 3, accel: 1, weight: 14, stab: 3, color: 0xffffff },
        { name: 'Neo-Vanquish', speed: 4, accel: 3, weight: 10, stab: 1, color: 0x388e3c }
    ]}
];

let currentStep = 0;
let carStats = { speed: 0, accel: 0, weight: 0, stab: 0 };
const selectedParts = {};

// 3D Object Group ของตัวรถ
const carGroup = new THREE.Group();
scene.add(carGroup);

// --- 3. GARAGE BUILDER LOGIC ---
function renderUI() {
    const listEl = document.getElementById('options-list');
    listEl.innerHTML = '';
    
    if (currentStep < assemblySteps.length) {
        const step = assemblySteps[currentStep];
        document.getElementById('step-desc').innerText = `ขั้นตอนที่ ${currentStep + 1}: เลือก ${step.name}`;
        
        step.items.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'item-btn';
            btn.innerText = `${item.name}\n(Spd:+${item.speed} | Wt:${item.weight}g)`;
            btn.onclick = () => selectPart(step.key, item);
            listEl.appendChild(btn);
        });
    } else {
        document.getElementById('step-desc').innerText = "ประกอบรถเสร็จสมบูรณ์!";
        document.getElementById('go-race-btn').style.display = 'block';
    }
}

function selectPart(stepKey, item) {
    selectedParts[stepKey] = item;
    
    // อัปเดตสเตตัส
    carStats.speed += item.speed;
    carStats.accel += item.accel;
    carStats.weight += item.weight;
    carStats.stab += item.stab;
    
    document.getElementById('st-speed').innerText = carStats.speed;
    document.getElementById('st-accel').innerText = carStats.accel;
    document.getElementById('st-weight').innerText = carStats.weight;
    document.getElementById('st-stab').innerText = carStats.stab;

    // สร้างโมเดลแบบมินิมอลจำลองชิ้นส่วน
    updateCarModel(stepKey, item);

    currentStep++;
    renderUI();
}

function updateCarModel(key, item) {
    if (key === 'chassis') {
        const geo = new THREE.BoxGeometry(1.2, 0.3, 2.5);
        const mat = new THREE.MeshStandardMaterial({ color: item.color });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.y = 0.2;
        carGroup.add(mesh);
    } else if (key === 'wheels') {
        const wGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.15, 16);
        const wMat = new THREE.MeshStandardMaterial({ color: item.color });
        [[-0.7,0.35,0.8],[0.7,0.35,0.8],[-0.7,0.35,-0.8],[0.7,0.35,-0.8]].forEach(p => {
            const w = new THREE.Mesh(wGeo, wMat);
            w.rotation.z = Math.PI / 2;
            w.position.set(...p);
            carGroup.add(w);
        });
    } else if (key === 'body') {
        const bGeo = new THREE.BoxGeometry(1.0, 0.4, 1.8);
        const bMat = new THREE.MeshStandardMaterial({ color: item.color, metalness: 0.3 });
        const bMesh = new THREE.Mesh(bGeo, bMat);
        bMesh.position.y = 0.5;
        carGroup.add(bMesh);
    }
}

// --- 4. TRACK & RACE SYSTEM ---
let isRacingMode = false;
let isRunning = false;
let progress = 0;
let lap = 0;
let startTime = 0;
let raceTimer = null;

// พิกัดสนามแข่ง (JCJC Oval Track)
const trackPoints = [
    new THREE.Vector3( 5, 0,  8),
    new THREE.Vector3( 8, 0,  0),
    new THREE.Vector3( 5, 0, -8),
    new THREE.Vector3(-5, 0, -8),
    new THREE.Vector3(-8, 0,  0),
    new THREE.Vector3(-5, 0,  8),
    new THREE.Vector3( 0, 1.2, 7.5), // สะพานยกระดับ
    new THREE.Vector3( 2.5, 0, 8)
];
const trackCurve = new THREE.CatmullRomCurve3(trackPoints, true);

// สร้างโมเดลราง
const tubeGeo = new THREE.TubeGeometry(trackCurve, 200, 0.9, 8, false);
const trackMesh = new THREE.Mesh(tubeGeo, new THREE.MeshStandardMaterial({ color: 0xdddddd }));
trackMesh.scale.set(1, 0.1, 1);
trackMesh.visible = false;
scene.add(trackMesh);

function startRaceMode() {
    isRacingMode = true;
    document.getElementById('parts-selector').style.display = 'none';
    document.getElementById('stats-panel').style.display = 'none';
    document.getElementById('race-ui').style.display = 'block';
    
    grid.visible = false;
    trackMesh.visible = true;
    
    // ย้ายมุมกล้องไปมุมมองสนาม
    camera.position.set(0, 22, 25);
    controls.target.set(0, 0, 0);
}

function backToGarage() {
    location.reload(); // รีโหลดเพื่อเริ่มแต่งใหม่
}

function toggleRun() {
    isRunning = !isRunning;
    if (isRunning) {
        if(lap >= 3) { lap = 0; progress = 0; }
        startTime = Date.now();
        raceTimer = setInterval(updateTimer, 10);
    } else {
        clearInterval(raceTimer);
    }
}

function updateTimer() {
    const diff = Date.now() - startTime;
    const ms = Math.floor((diff % 1000) / 10).toString().padStart(2, '0');
    const sec = Math.floor((diff / 1000) % 60).toString().padStart(2, '0');
    const min = Math.floor(diff / (1000 * 60)).toString().padStart(2, '0');
    document.getElementById('timer').innerText = `${min}:${sec}:${ms}`;
}

// --- 5. ANIMATION LOOP ---
const p1 = new THREE.Vector3();
const p2 = new THREE.Vector3();

function animate() {
    requestAnimationFrame(animate);

    if (isRacingMode && isRunning) {
        // คำนวณความเร็ววิ่งตามสเตตัส Speed ที่ผู้เล่นแต่ง
        const currentSpeed = 0.001 + (carStats.speed * 0.0002);
        progress += currentSpeed;

        if (progress >= 1) {
            progress -= 1;
            lap++;
            document.getElementById('lap-counter').innerText = `Lap: ${Math.min(lap, 3)} / 3`;
            
            if (lap >= 3) {
                isRunning = false;
                clearInterval(raceTimer);
                alert(`เข้าเส้นชัยแล้ว! เวลาทั้งหมด: ${document.getElementById('timer').innerText}`);
            }
        }

        // คำนวณตำแหน่งและทิศทางวิ่ง
        trackCurve.getPointAt(progress, p1);
        trackCurve.getPointAt((progress + 0.005) % 1, p2);

        p1.y += 0.12;
        p2.y += 0.12;

        carGroup.position.copy(p1);
        carGroup.lookAt(p2);
    }

    controls.update();
    renderer.render(scene, camera);
}

renderUI();
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
