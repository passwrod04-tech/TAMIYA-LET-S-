<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamiya JCJC Track Simulation - Fixed</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #111; color: white; }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(0,0,0,0.85); padding: 20px; border-radius: 10px; border: 1px solid #444; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { margin: 0 0 10px 0; font-size: 1.2rem; color: #ff4444; }
        p { margin: 0 0 15px 0; font-size: 0.85rem; color: #ccc; }
        button { background: #e53935; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #ff5252; }
    </style>
    
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui">
        <h2>Tamiya JCJC Track 3D</h2>
        <p>สนามมาตรฐาน 3 เลน + สะพานสลับเลนยกระดับ</p>
        <button onclick="toggleRace()" id="race-btn">ปล่อยรถแข่ง / หยุด</button>
    </div>

    <div id="canvas-container"></div>

<script>
// --- 1. ตั้งค่า Scene / Camera / Renderer ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 20, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

// แสงสว่าง
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const light = new THREE.DirectionalLight(0xffffff, 0.8);
light.position.set(10, 25, 10);
scene.add(light);

// Grid พื้นหลัง
const grid = new THREE.GridHelper(30, 30, 0x444444, 0x222222);
scene.add(grid);

// --- 2. ถอดพิกัดสนาม JCJC ---
const trackPoints = [
    // โค้งฝั่งน้ำเงิน
    new THREE.Vector3( 4, 0,  6),
    new THREE.Vector3( 7, 0,  0),
    new THREE.Vector3( 4, 0, -6),

    // ทางตรงช่วงบน
    new THREE.Vector3( 1, 0, -6),
    new THREE.Vector3(-1, 0, -6),

    // โค้งฝั่งแดง
    new THREE.Vector3(-4, 0, -6),
    new THREE.Vector3(-7, 0,  0),
    new THREE.Vector3(-4, 0,  6),

    // ทางตรงช่วงล่าง + สะพานยกระดับสลับเลน
    new THREE.Vector3(-2.5, 0,   6),
    new THREE.Vector3(-1.0, 1.2, 5.5),
    new THREE.Vector3( 0.0, 1.2, 6.0),
    new THREE.Vector3( 1.0, 1.2, 6.5),
    new THREE.Vector3( 2.5, 0,   6)
];

const trackCurve = new THREE.CatmullRomCurve3(trackPoints, true, 'centripetal');

// --- 3. สร้างโมเดลราง 3D ---
const tubeGeo = new THREE.TubeGeometry(trackCurve, 300, 0.8, 8, false);
const trackMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.3 });
const trackMesh = new THREE.Mesh(tubeGeo, trackMat);
trackMesh.scale.set(1, 0.1, 1);
scene.add(trackMesh);

// --- 4. สร้างโมเดลรถแข่ง Tamiya ---
const carGroup = new THREE.Group();

// ตัวรถ
const bodyGeo = new THREE.BoxGeometry(0.7, 0.25, 1.2);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1565c0, metalness: 0.4, roughness: 0.2 });
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.position.y = 0.2;
carGroup.add(body);

// ล้อรถ 4 ล้อ
const wheelGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.08, 16);
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

const wheelPos = [
    [-0.4, 0.18,  0.35],
    [ 0.4, 0.18,  0.35],
    [-0.4, 0.18, -0.35],
    [ 0.4, 0.18, -0.35]
];

wheelPos.forEach(p => {
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI / 2;
    w.position.set(...p);
    carGroup.add(w);
});

scene.add(carGroup);

// --- 5. ระบบคำนวณตำแหน่งและองศาหมุนรถ (แก้ไขการหมุนด้วย Quaternion) ---
let progress = 0;
let isRacing = false;
const speed = 0.002;

function toggleRace() {
    isRacing = !isRacing;
}

const positionVec = new THREE.Vector3();
const tangentVec = new THREE.Vector3();
const forwardVec = new THREE.Vector3(0, 0, -1); // ทิศทางหน้ารถอ้างอิงใน Local Space
const carQuaternion = new THREE.Quaternion();

function animate() {
    requestAnimationFrame(animate);

    if (isRacing) {
        progress += speed;
        if (progress > 1) progress = 0;

        // 1. ดึงค่าตำแหน่งและทิศทางจาก Curve
        trackCurve.getPointAt(progress, positionVec);
        trackCurve.getTangentAt(progress, tangentVec);

        // 2. ปรับระยะความสูงให้อยู่บนรางพอดี
        positionVec.y += 0.08;
        carGroup.position.copy(positionVec);

        // 3. คำนวณ Quaternion เพื่อหันหน้ารถไปตาม Tangent โดยไม่เกิดค่า NaN
        carQuaternion.setFromUnitVectors(forwardVec, tangentVec.normalize());
        carGroup.quaternion.copy(carQuaternion);
    }

    controls.update();
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
