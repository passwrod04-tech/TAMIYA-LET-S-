<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamiya JCJC Track Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #111; color: white; }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 15px; left: 15px; z-index: 10; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; }
        button { background: #e53935; color: white; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        button:hover { background: #f44336; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui">
        <h2>Tamiya Japan Junior Circuit (JCJC)</h2>
        <div>สนาม 3 เลน + สะพานยกระดับสลับเลน + ลูกคลื่น</div>
        <br>
        <button onclick="toggleRace()" id="race-btn">ปล่อยรถแข่ง / หยุด</button>
    </div>

    <div id="canvas-container"></div>

<script>
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 15, 20);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// แสงสว่าง
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const light = new THREE.DirectionalLight(0xffffff, 0.8);
light.position.set(10, 20, 10);
scene.add(light);

// Grid พื้นหลัง
const grid = new THREE.GridHelper(30, 30, 0x444444, 0x333333);
scene.add(grid);

// ==========================================
// 1. ถอดพิกัดเส้นทางวิ่ง (Track Path Vector) จากรูป JCJC
// ==========================================
const trackPoints = [
    // 1. โค้งน้ำเงิน (180 องศา)
    new THREE.Vector3( 4, 0,  6),
    new THREE.Vector3( 7, 0,  0),
    new THREE.Vector3( 4, 0, -6),

    // 2. ทางตรงช่วงบน + ลูกคลื่น Wave Section (ขรุขระขึ้นลงนิดๆ)
    new THREE.Vector3( 1, 0.1, -6),
    new THREE.Vector3(-1, -0.1, -6),

    // 3. โค้งแดง (180 องศา)
    new THREE.Vector3(-4, 0, -6),
    new THREE.Vector3(-7, 0,  0),
    new THREE.Vector3(-4, 0,  6),

    // 4. ทางตรงช่วงล่าง + สะพานยกระดับสลับเลน (Lane Change Bridge)
    new THREE.Vector3(-2, 0,   6),
    new THREE.Vector3(-0.5, 1.2, 5.8), // ไต่ขึ้นสะพานสูง 1.2 หน่วย
    new THREE.Vector3( 0.5, 1.2, 6.2), // ข้ามจุดตัดราง
    new THREE.Vector3( 2, 0,   6)    // ลงสู่พื้นราบ
];

// สร้างเส้นทางแบบโค้งมนต่อเนื่อง
const trackCurve = new THREE.CatmullRomCurve3(trackPoints, true);

// ==========================================
// 2. สร้างโมเดลราง 3D และกำแพงราง
// ==========================================
const tubeGeo = new THREE.TubeGeometry(trackCurve, 200, 0.8, 8, false);
const trackMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, wireframe: false });
const trackMesh = new THREE.Mesh(tubeGeo, trackMat);
trackMesh.scale.set(1, 0.15, 1); // ปรับท่อกลมให้แบนเป็นพื้นราง
scene.add(trackMesh);

// ==========================================
// 3. สร้างโมเดลรถ Tamiya
// ==========================================
const carGroup = new THREE.Group();

// บอดี้รถ
const bodyGeo = new THREE.BoxGeometry(0.8, 0.3, 1.4);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1565c0 });
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.position.y = 0.25;
carGroup.add(body);

// ล้อรถ 4 ล้อ
const wheelGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.1, 16);
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
const wheelPos = [[-0.45, 0.2, 0.4], [0.45, 0.2, 0.4], [-0.45, 0.2, -0.4], [0.45, 0.2, -0.4]];

wheelPos.forEach(p => {
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI / 2;
    w.position.set(...p);
    carGroup.add(w);
});

scene.add(carGroup);

// ==========================================
// 4. ระบบคำนวณการวิ่งตามราง (Car Animation)
// ==========================================
let progress = 0;
let isRacing = false;
const speed = 0.0025; // ความเร็วรถ

function toggleRace() {
    isRacing = !isRacing;
}

function animate() {
    requestAnimationFrame(animate);

    if (isRacing) {
        progress += speed;
        if (progress > 1) progress = 0;

        // ดึงตำแหน่งบนเส้นทางราง ณ เวลาปัจจุบัน
        const point = trackCurve.getPointAt(progress);
        const tangent = trackCurve.getTangentAt(progress);

        // วางตำแหน่งรถ
        carGroup.position.copy(point);

        // หันหน้ารถไปตามทิศทางราง
        const lookAtTarget = point.clone().add(tangent);
        carGroup.lookAt(lookAtTarget);
    }

    controls.update();
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
