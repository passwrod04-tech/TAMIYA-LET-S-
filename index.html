<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamiya JCJC Track Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: white; }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(0,0,0,0.85); padding: 20px; border-radius: 10px; border: 1px solid #444; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { margin: 0 0 10px 0; font-size: 1.2rem; color: #ff4444; }
        p { margin: 0 0 15px 0; font-size: 0.85rem; color: #ccc; }
        button { background: #e53935; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #ff5252; }
    </style>
    
    <!-- นำเข้า Three.js และ OrbitControls -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui">
        <h2>Tamiya JCJC Track 3D</h2>
        <p>สนามมาตรฐาน 3 เลน + สะพานสลับเลนยกระดับ</p>
        <button onclick="toggleRace()" id="race-btn">ปล่อยรถแข่ง / หยุด</button>
    </div>

    <div id="canvas-container"></div>

<script>
// --- 1. ตั้งค่า Scene / Camera / Renderer ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 18, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

// แสงสว่าง
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const light = new THREE.DirectionalLight(0xffffff, 0.9);
light.position.set(10, 20, 10);
scene.add(light);

// Grid พื้นหลัง
const grid = new THREE.GridHelper(30, 30, 0x444444, 0x222222);
scene.add(grid);

// --- 2. ถอดพิกัดสนาม JCJC จากรูปภาพ ---
const trackPoints = [
    // โค้งฝั่งน้ำเงิน
    new THREE.Vector3( 4, 0,  6),
    new THREE.Vector3( 7, 0,  0),
    new THREE.Vector3( 4, 0, -6),

    // ทางตรงช่วงบน + ลูกคลื่น Wave Section
    new THREE.Vector3( 1, 0.1, -6),
    new THREE.Vector3(-1, -0.1, -6),

    // โค้งฝั่งแดง
    new THREE.Vector3(-4, 0, -6),
    new THREE.Vector3(-7, 0,  0),
    new THREE.Vector3(-4, 0,  6),

    // ทางตรงช่วงล่าง + สะพานยกระดับสลับเลน
    new THREE.Vector3(-2, 0,   6),
    new THREE.Vector3(-0.5, 1.2, 5.8), // ขึ้นสะพาน
    new THREE.Vector3( 0.5, 1.2, 6.2), // ข้ามจุดตัด
    new THREE.Vector3( 2, 0,   6)    // ลงสู่พื้นราบ
];

const trackCurve = new THREE.CatmullRomCurve3(trackPoints, true);

// --- 3. สร้างโมเดลราง 3D ---
const tubeGeo = new THREE.TubeGeometry(trackCurve, 200, 0.8, 8, false);
const trackMat = new THREE.MeshStandardMaterial({ color: 0xe0e0e0, roughness: 0.4 });
const trackMesh = new THREE.Mesh(tubeGeo, trackMat);
trackMesh.scale.set(1, 0.15, 1); // บีบท่อให้แบนเป็นพื้นราง
scene.add(trackMesh);

// --- 4. สร้างโมเดลรถแข่ง Tamiya (ปรับทิศทางแกนให้ถูกต้อง) ---
const carGroup = new THREE.Group();

// ตัวรถ (สลับความยาว X และ Z เพื่อให้หน้ารถหันไปทางแกน -Z)
const bodyGeo = new THREE.BoxGeometry(0.8, 0.3, 1.4);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1565c0, metalness: 0.3 });
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.position.y = 0.25;
carGroup.add(body);

// ล้อรถ 4 ล้อ (ปรับพิกัดล้อให้ขนานกับตัวรถ)
const wheelGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.1, 16);
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

// ตำแหน่ง [x, y, z] ของล้อทั้ง 4
const wheelPos = [
    [-0.45, 0.2,  0.4],
    [ 0.45, 0.2,  0.4],
    [-0.45, 0.2, -0.4],
    [ 0.45, 0.2, -0.4]
];

wheelPos.forEach(p => {
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI / 2; // หมุนล้อให้ตั้งฉากกับพื้น
    w.position.set(...p);
    carGroup.add(w);
});

scene.add(carGroup);

// --- 5. ระบบวิ่งตามราง (แก้ไขฟังก์ชันหมุนหน้ารถ) ---
let progress = 0;
let isRacing = false;
const speed = 0.0025;

function toggleRace() {
    isRacing = !isRacing;
}

function animate() {
    requestAnimationFrame(animate);

    if (isRacing) {
        progress += speed;
        if (progress > 1) progress = 0;

        // คำนวณตำแหน่งและทิศทางบนเส้นทาง
        const point = trackCurve.getPointAt(progress);
        const tangent = trackCurve.getTangentAt(progress);

        carGroup.position.copy(point);

        // คำนวณจุดที่รถต้องมองไปด้านหน้า
        const lookAtTarget = point.clone().add(tangent);
        carGroup.lookAt(lookAtTarget);
    }

    controls.update();
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
